  flutter_screenutil: ^5.9.3
  calendar_date_picker2: ^3.0.0
  signalr_core: ^1.1.2
  cached_network_image: ^3.3.1
  camera: ^0.12.0+1
  js: ^0.6.7
  go_router: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dreamflow_icon.jpg
  remove_alpha_ios: true
