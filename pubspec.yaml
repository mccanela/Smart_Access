version: 2.0.0
environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.1
  material_symbols_icons: ^4.2906.0
  font_awesome_flutter: ^11.0.0

  flutter_date_range_picker: ^0.2.1
  http: ^1.2.1
  shared_preferences: ^2.2.2
  image_picker: ^1.1.0       # atualizar para null safety
  image_picker_for_web: ^3.1.0 # exemplo
  simple_web_camera: ^1.0.5
  permission_handler: ^12.0.1
  dropdown_search: ^7.0.0
  reorderables: ^0.6.0
  encrypt: ^5.0.1
  pointycastle: ^3.7.3
  date_field: ^6.0.3+1
  image: ^4.1.7
  path_provider: ^2.1.2
  pdf: ^3.11.0
  pdfx: ^2.6.0
  syncfusion_flutter_pdf: ^33.2.7
  file_picker: ^8.0.7
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_selfie_segmentation: ^0.10.1
  path: ^1.9.0
  url_launcher: ^6.3.0
